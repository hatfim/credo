name: Setup
description: Install pnpm (version from the root packageManager field), Node (from .nvmrc unless node-version is given), dependencies with a frozen lockfile, and restore the Turborepo cache.

inputs:
  node-version:
    description: Node version to use (for example 24). Empty keeps the default, the version in .nvmrc.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # pnpm version comes from package.json "packageManager"; no version input on purpose.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
        cache: pnpm

    - name: Restore Turborepo cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}${{ inputs.node-version != '' && format('-node{0}', inputs.node-version) || '' }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}${{ inputs.node-version != '' && format('-node{0}', inputs.node-version) || '' }}-${{ github.job }}-
          turbo-${{ runner.os }}${{ inputs.node-version != '' && format('-node{0}', inputs.node-version) || '' }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
