name: Visual

# Required check `visual` (SBK-04, TST-06). Runs on every pull request into main, with no path
# filters: a skipped required check stays pending. A diff fails the job and uploads the images;
# a reviewer approves by regenerating baselines (see docs/contributing/visual-testing.md).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  visual:
    name: visual
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build Storybook
        run: pnpm exec turbo run build --filter=@usecredo/storybook
      # The browser build is the one pinned by the lockfile through @playwright/test.
      - name: Install Playwright Chromium
        working-directory: apps/storybook
        run: pnpm exec playwright install --with-deps chromium
      - name: Run visual snapshots
        working-directory: apps/storybook
        run: pnpm run test:visual
      - name: Upload diff images and report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: |
            apps/storybook/test-results/visual
            apps/storybook/playwright-report
          retention-days: 14
          if-no-files-found: warn
