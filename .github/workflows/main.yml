name: Main

# PRD 11.3 / DST-07 / P1-23. On every push to main: the full check (not --affected), the visual
# run, the isolated consumers, and a snapshot publish of the four published packages to the npm
# dist-tag `next`. The publish job is OFF until the repository variable PUBLISH_NEXT is "true".
# See docs/contributing/releases-next.md. Job names differ from the pull request ones on purpose.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  main-check:
    name: main-check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Everything, no --affected: lint (with import boundaries), typecheck, tests, builds,
      # Storybook smoke and accessibility, docs links.
      - run: pnpm check

  main-visual:
    name: main-visual
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build Storybook
        run: pnpm exec turbo run build --filter=@usecredo/storybook
      - name: Install Playwright Chromium
        working-directory: apps/storybook
        run: pnpm exec playwright install --with-deps chromium
      # Fails with a clear message when no baselines are committed (apps/storybook/visual/global-setup.ts).
      - name: Run visual snapshots
        working-directory: apps/storybook
        run: pnpm run test:visual
      - name: Upload diff images and report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: |
            apps/storybook/test-results/visual
            apps/storybook/playwright-report
          retention-days: 14
          if-no-files-found: warn

  main-consumers:
    name: main-consumers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Loopback registry only; never publishes to npmjs.org (docs/contributing/consumers.md).
      - run: pnpm test:consumers

  publish-next:
    name: publish-next
    needs: [main-check, main-visual, main-consumers]
    # Defense in depth. The trigger already limits this workflow to pushes to main of this
    # repository (fork pushes run in the fork, with its own variables and no access to our secrets).
    # The variable is the owner's switch: unset or anything but "true" means nothing is published.
    if: >-
      ${{ github.event_name == 'push'
      && github.repository == 'hatfim/credo'
      && github.ref == 'refs/heads/main'
      && vars.PUBLISH_NEXT == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing (OIDC). Nothing else.
    # The same push must not publish twice, and a later push waits instead of racing.
    concurrency:
      group: publish-next
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Look for changesets to snapshot
        id: changesets
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l | tr -d ' ')
          echo "Pending changesets: $count"
          if [ "$count" = "0" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No changesets to snapshot; nothing is published to next."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Edits package.json files in this runner's working tree only. Nothing is committed or pushed,
      # and the job has no token that could push (contents: read, credentials not persisted).
      - name: Set snapshot versions
        if: steps.changesets.outputs.present == 'true'
        run: pnpm exec changeset version --snapshot next

      - name: Build the published packages
        if: steps.changesets.outputs.present == 'true'
        run: >-
          pnpm exec turbo run build
          --filter=@usecredo/tokens --filter=@usecredo/tailwind-config
          --filter=@usecredo/icons --filter=@usecredo/ui

      # Changed packages must be snapshots; unchanged ones must be snapshots or already on npm.
      - name: Check that every changed version is a snapshot
        if: steps.changesets.outputs.present == 'true'
        run: node scripts/release/snapshot-versions.mjs

      # decision 0007 (npm-publish-auth): the owner moves all four packages to trusted publishing after the
      # first publish and deletes NPM_TOKEN. Until then, two ways to authenticate, in order of preference.
      #  1. Trusted publishing (OIDC): no stored secret. Needs a trusted publisher configured on npm for
      #     each package (workflow main.yml) and npm 11.5.1 or newer, installed below when no token is set.
      #  2. Fallback: the repository secret NPM_TOKEN (granular, publish-only, scope @usecredo), read
      #     only here through env. Needed for the very first publish, because a trusted publisher can
      #     only be configured for a package that already exists.
      # Provenance is requested either way. This step never pushes or tags (--no-git-tag).
      - name: Publish to the next dist-tag
        if: steps.changesets.outputs.present == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          echo "::notice::The FIRST publish of a package also sets its latest dist-tag to the snapshot, even with --tag next. See docs/contributing/releases-next.md before relying on latest."
          if [ -n "$NPM_TOKEN" ]; then
            echo "Authenticating with the NPM_TOKEN secret."
            printf '%s\n' "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$RUNNER_TEMP/npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          else
            echo "No NPM_TOKEN: using trusted publishing (OIDC)."
            npm install --global npm@11.5.1
          fi
          pnpm exec changeset publish --tag next --no-git-tag
