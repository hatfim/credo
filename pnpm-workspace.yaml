packages:
  - "apps/*"
  - "packages/*"
  - "consumers/*"

# Shared dependency versions are declared once here and checked by syncpack.
catalog:
  "@changesets/cli": ^3.0.3
  "@eslint/js": ^10.0.1
  eslint: ^10.13.0
  globals: ^17.13.0
  syncpack: ^15.3.3
  turbo: ^2.11.8
  # typescript-eslint supports TypeScript below 6.1 only.
  typescript: 6.0.3
  typescript-eslint: ^8.71.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  react: ^19.3.1
  react-dom: ^19.3.1
  # TODO(decision: tailwind-minimum): pinned to the current v4 release until the record is accepted.
  tailwindcss: 4.3.3
  tsup: ^9.0.0
  clsx: ^2.1.1
  vitest: ^5.0.5
  jsdom: ^30.1.3
  axe-core: ^4.14.0
  "@testing-library/react": ^16.3.3
  "@testing-library/dom": ^10.4.2
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/user-event": ^14.6.8
  "@phosphor-icons/react": ^2.1.10
  tailwind-merge: ^3.7.0
  class-variance-authority: ^0.7.1

onlyBuiltDependencies:
  - esbuild
